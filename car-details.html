<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Details</title>

<style>

/* BASE */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Lato", sans-serif;
    background: #0b1220;
    color: #e5e7eb;
}

/* LAYOUT */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
}

.main-card {
    background: #111827;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.05);
}

.main-flex {
    display: flex;
    gap: 20px;
    align-items: flex-start;
}

/* LEFT */
.hero {
    width: 68%;
}

/* SLIDER */
.slider {
    width: 100%;
    height: 300px;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: radial-gradient(circle at center, #1f2937 0%, #0b1220 100%);
}

#car-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
    transition: opacity .35s ease;
}

/* ARROWS */
.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
    background: rgba(17, 24, 39, 0.7);
    color: #fff;
    backdrop-filter: blur(6px);
    transition: .2s ease;
    user-select: none;
}

.arrow:hover {
    background: rgba(255,255,255,0.15);
}

.arrow.left { left: 10px; }
.arrow.right { right: 10px; }

/* THUMBNAILS */
#thumbnails {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

#thumbnails::-webkit-scrollbar {
    display: none;
}

#thumbnails img {
    width: 90px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    opacity: .65;
    border: 2px solid transparent;
    transition: .2s ease;
    flex-shrink: 0;
}

#thumbnails img:hover {
    transform: scale(1.05);
    opacity: 1;
}

#thumbnails img.active {
    border-color: #ef4444;
    opacity: 1;
}

/* RIGHT PANEL */
.side-info {
    width: 32%;
    padding: 6px 0;
}

.side-info h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
}

.price {
    font-size: 22px;
    font-weight: 700;
    color: #ef4444;
    margin-bottom: 10px;
}

/* INFO BLOCKS */
#engine,
#mileage,
#type {
    font-size: 16px;
    font-weight: 600;
    margin-top: 6px;
    color: #e5e7eb;
}

#rating {
    margin-top: 8px;
    color: #fbbf24;
    font-size: 15px;
}

/* HIGHLIGHTS */
.highlights {
    display: flex;
    gap: 12px;
    margin-top: 18px;
}

.card {
    flex: 1;
    background: #111827;
    border: 1px solid rgba(255,255,255,0.05);
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    color: #d1d5db;
}

/* TABS */
.tabs {
    display: flex;
    gap: 22px;
    margin-top: 26px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.tab {
    padding: 12px 0;
    cursor: pointer;
    color: #9ca3af;
    font-size: 15px;
    font-weight: 500;
}

.tab.active {
    color: #ef4444;
    border-bottom: 2px solid #ef4444;
    font-weight: 700;
}

/* CONTENT */
.tab-content {
    display: none;
    margin-top: 18px;
}

.tab-content.active {
    display: block;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: #d1d5db;
}

/* LISTS */
ul {
    margin-top: 10px;
    padding-left: 18px;
    color: #d1d5db;
}

/* SPEC TABLE ENHANCEMENT (FIXED CONSISTENCY) */
#spec-table {
    width: 100%;
    border-collapse: collapse;
}

#spec-table td {
    padding: 14px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

#spec-table tr:last-child td {
    border-bottom: none;
}

#spec-table tr:hover td {
    background: rgba(255,255,255,0.03);
}

/* OVERVIEW */
#overview-text {
    line-height: 1.8;
    font-size: 15px;
    color: #e5e7eb;
    background: rgba(255,255,255,0.03);
    padding: 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    white-space: pre-line;
}

.emi-box {
    margin-top: 20px;
    padding: 20px;
    width: 100%;
    max-width: 350px;

    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;

    color: white;
}

.emi-box h3 {
    margin-bottom: 15px;
    font-size: 20px;
}

.emi-box label {
    font-size: 14px;
    display: block;
    margin-top: 10px;
}

.emi-box input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;

    border-radius: 8px;
    border: none;
    outline: none;
}

.emi-box button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;

    background: #ff3c00;
    color: white;
    border: none;
    border-radius: 8px;

    cursor: pointer;
    transition: 0.3s;
}

.emi-box button:hover {
    background: #ff9f00;
}

.emi-result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

.bottom-links {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding-bottom: 30px;
}

.glass-link {
    padding: 12px 20px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;

    color: #e5e7eb;
    text-decoration: none;
    font-size: 14px;

    transition: 0.25s ease;
}

.glass-link:hover {
    background: rgb(30, 161, 161);
    transform: translateY(-3px);
    color: white;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .main-flex {
        flex-direction: column;
    }

    .hero,
    .side-info {
        width: 100%;
    }

    .slider {
        height: 220px;
    }

    #thumbnails img {
        width: 75px;
        height: 50px;
    }
}

</style>
</head>

<div class="container">

    <div class="main-card">

        <div class="main-flex">

            <!-- LEFT: IMAGE SECTION -->
            <div class="hero">
                <div class="slider">
                    <img id="car-img" alt="Car image">
                    <div class="arrow left" onclick="prevImage()">❮</div>
                    <div class="arrow right" onclick="nextImage()">❯</div>
                </div>
                <div id="thumbnails"></div>
            </div>

            <!-- RIGHT: CAR INFO -->
            <div class="side-info">
                <h1 id="car-name"></h1>
                <div class="price" id="price"></div>
                <div id="rating"></div>

                <!-- EMI CALCULATOR BOX -->
                <div class="emi-box">
                    <h3>EMI Calculator</h3>

                    <label>Loan Amount (₹)</label>
                    <input type="number" id="loanAmount" placeholder="Enter loan amount">

                    <label>Interest Rate (% per year)</label>
                    <input type="number" id="interestRate" placeholder="e.g. 9">

                    <label>Tenure (years)</label>
                    <input type="number" id="tenure" placeholder="e.g. 5">

                    <button onclick="calculateEMI()">Calculate EMI</button>

                    <button onclick="resetEMI()" style="background:#2963c2;margin-top:8px;">
                        Reset
                    </button>

                    <div class="emi-result">
                        Monthly EMI: <span id="emiOutput">₹0</span>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- HIGHLIGHTS -->
    <div class="highlights">
        <div class="card" id="engine"></div>
        <div class="card" id="mileage"></div>
        <div class="card" id="type"></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <div class="tab active" data-tab="overview">Overview</div>
        <div class="tab" data-tab="specs">Specs</div>
        <div class="tab" data-tab="variants">Variants</div>
        <div class="tab" data-tab="proscons">Pros & Cons</div>
    </div>

    <!-- OVERVIEW -->
    <div id="overview" class="tab-content active">
        <p id="overview-text"></p>
    </div>

    <!-- SPECS -->
    <div id="specs" class="tab-content">
        <table>
            <tbody id="spec-table"></tbody>
        </table>
    </div>

    <!-- VARIANTS -->
    <div id="variants" class="tab-content">

        <h3 style="margin-bottom:8px;">Variants</h3>

        <ul id="variant-list"></ul>

        <div style="height:20px;"></div>

        <p style="font-size:13px; color:#9ca3af;">
            Prices may vary based on city, offers, and dealership availability.
        </p>

    </div>

    <!-- PROS & CONS -->
    <div id="proscons" class="tab-content">

        <h3 style="margin-bottom:8px;">Pros</h3>
        <ul id="pros"></ul>

        <!-- DIVIDER LINE -->
        <div style="height:1px; background: rgba(255,255,255,0.08); margin:18px 0;"></div>

        <h3 style="margin-bottom:8px;">Cons</h3>
        <ul id="cons"></ul>

    </div>

</div>

function showTab(tabId) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

    document.querySelectorAll(".tab").forEach(t => {
        if (t.dataset.tab === tabId) t.classList.add("active");
    });

    const tab = document.getElementById(tabId);
    if (tab) tab.classList.add("active");
}

// -------- SETUP --------
const selectedCar = cars?.[carParam];

if (!selectedCar) {
    document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:50px;'>Car not found</h2>";
    throw new Error("Invalid or missing car parameter");
}

// -------- CACHE DOM --------
const img = document.getElementById("car-img");
const thumbContainer = document.getElementById("thumbnails");

img.decoding = "async";
img.loading = "eager";

const carNameEl = document.getElementById("car-name");

const prosEl = document.getElementById("pros");
const consEl = document.getElementById("cons");

document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
        showTab(tab.dataset.tab);
    });
});

// -------- IMAGE SLIDER --------
let currentIndex = 0;
const currentImages = selectedCar.images;

let imageTimer = null;
let thumbnailImgs = [];

function showImage(index) {
    currentIndex = (index + currentImages.length) % currentImages.length;

    if (imageTimer) clearTimeout(imageTimer);

    img.style.opacity = 0;

    const newSrc = currentImages[currentIndex];

    // preload
    new Image().src = newSrc;

    const startTime = Date.now();

    imageTimer = setTimeout(() => {

        img.onload = () => {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, 120 - elapsed);

            setTimeout(() => {
                requestAnimationFrame(() => {
                    img.style.opacity = 1;
                });
            }, remaining);
        };

        // handle cached image case
        if (img.src !== newSrc) {
            img.src = newSrc;
        } else {
            img.style.opacity = 1;
        }

    }, 120);

    // update thumbnails (cached)
    thumbnailImgs.forEach((thumb, i) => {
        thumb.classList.toggle("active", i === currentIndex);
    });
}

function nextImage() { showImage(currentIndex + 1); }
function prevImage() { showImage(currentIndex - 1); }

window.showImage = showImage;
window.nextImage = nextImage;
window.prevImage = prevImage;

// -------- BASIC INFO --------
carNameEl.innerText = selectedCar.name;
priceEl.innerText = selectedCar.price;
engineEl.innerText = "Engine: " + selectedCar.engine;
mileageEl.innerText = "Mileage: " + selectedCar.mileage;

    thumbContainer.appendChild(t);
    thumbnailImgs.push(t);
});

function calculateEMI() {
    let P = parseFloat(document.getElementById("loanAmount").value);
    let R = parseFloat(document.getElementById("interestRate").value) / 12 / 100;
    let N = parseFloat(document.getElementById("tenure").value) * 12;

    if (!P || !R || !N) {
        alert("Please fill all fields correctly");
        return;
    }

    let emi = (P * R * Math.pow(1 + R, N)) / (Math.pow(1 + R, N) - 1);

    document.getElementById("emiOutput").innerText =
        "₹" + emi.toFixed(0);
}

function resetEMI() {
    document.getElementById("loanAmount").value = "";
    document.getElementById("interestRate").value = "";
    document.getElementById("tenure").value = "";

    document.getElementById("emiOutput").innerText = "₹0";
}
